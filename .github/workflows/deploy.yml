name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true

    runs-on: self-hosted

    steps:
      # Step 1: Checkout main branch
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Step 2: Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Check Java version
      - name: Check Java Version
        run: |
          java -version
          javac -version

      # Step 4: Build Spring Boot application
      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Step 5: Verify generated JAR
      - name: Verify JAR File
        run: |
          ls -lh target/*.jar

      # Step 6: Stop old Spring Boot application
      - name: Stop Old Application
        run: |
          APP_DIR="/home/ubuntu/spring-demo"

          if [ -f "$APP_DIR/app.pid" ]; then
            PID=$(cat "$APP_DIR/app.pid")

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"

              for i in $(seq 1 10); do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -9 "$PID"
              fi
            fi

            rm -f "$APP_DIR/app.pid"
          fi

      # Step 7: Copy new JAR
      - name: Copy New Application
        run: |
          APP_DIR="/home/ubuntu/spring-demo"

          mkdir -p "$APP_DIR"

          JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No application JAR found in target/"
            exit 1
          fi

          cp "$JAR_FILE" "$APP_DIR/app.jar"

          echo "Deployed JAR: $JAR_FILE"

      # Step 8: Start Spring Boot on port 8081
      - name: Start Application
        run: |
          APP_DIR="/home/ubuntu/spring-demo"

          cd "$APP_DIR"

          RUNNER_TRACKING_ID="" nohup java -jar app.jar --server.port=8081 > app.log 2>&1 &

          echo $! > app.pid

      # Step 9: Verify deployment
      - name: Verify Deployment
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/hello; then
              echo ""
              echo "Deployment successful!"
              exit 0
            fi

            echo "Waiting for Spring Boot to start... ($i/30)"
            sleep 2
          done

          echo "ERROR: Spring Boot did not respond successfully."
          echo "Application logs:"
          cat /home/ubuntu/spring-demo/app.log
          exit 1